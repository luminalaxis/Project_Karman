# 가정값의 불확실성 범위. **이 범위 자체도 가정이다** (실측 경험이 없는 값은 넓게 잡음).
# 용도: (1) 몬테카를로 랩타임 분포·리어윙 순위 역전 확률 (E1), (2) "먼저 실측해야 할 파라미터" 순위 (민감도 × σ).
# dist: normal (mean = 현재 설정값, sigma) | uniform (low/high = 현재값 기준 ±, 즉 상대 오프셋)
# clip: 물리적 범위 [min, max] 로 자름.
parameters:
  mass_kg:                       {dist: normal, sigma: 8.0,   clip: [250, 400], note: "설계 단계 질량 예측 오차"}
  cg_height_m:                   {dist: normal, sigma: 0.02,  clip: [0.18, 0.40]}
  static_front_fraction:         {dist: normal, sigma: 0.015, clip: [0.35, 0.60]}
  lltd_front:                    {dist: normal, sigma: 0.04,  clip: [0.30, 0.75], note: "롤 강성 미정"}
  tire.mu0:                      {dist: normal, sigma: 0.10,  clip: [1.0, 2.0], note: "노면·온도·타이어 상태 포함 실효값이라 불확실성 큼"}
  tire.load_sensitivity:         {dist: normal, sigma: 0.05,  clip: [-0.35, 0.0]}
  tire.rolling_resistance_coeff: {dist: normal, sigma: 0.004, clip: [0.005, 0.03]}
  powertrain.efficiency:         {dist: normal, sigma: 0.03,  clip: [0.7, 0.95]}
  powertrain.motor_max_torque_nm: {dist: normal, sigma: 10.0, clip: [150, 300]}
  aero.cla_m2:                   {dist: normal, sigma: 0.35,  clip: [1.0, 6.0], note: "CFD↔실차 상관 미검증"}
  aero.cda_m2:                   {dist: normal, sigma: 0.15,  clip: [0.6, 2.2]}
  aero.balance_front:            {dist: normal, sigma: 0.03,  clip: [0.30, 0.65]}
  aero.air_density_kg_m3:        {dist: normal, sigma: 0.03,  clip: [1.10, 1.30], note: "대회 당일 기온·기압"}
# 2D→3D 변환 계수의 불확실성 (리어윙 후보 간에 공통으로 적용 → 후보 간 상대 순위에 영향)
wing_conversion:
  endplate_factor: {dist: uniform, low: 1.2, high: 1.9}
  oswald_e:        {dist: uniform, low: 0.75, high: 0.95}
  k_lift_scale:    {dist: uniform, low: 0.85, high: 1.10, note: "k = AR/(AR+2) 에 곱하는 보정"}
# 후보별 독립 오차: 2D CFD 자체의 수치 오차 (메시·난류모델) — 후보마다 따로 뽑음
candidate_noise:
  cl_2d_rel_sigma: 0.02
  cd_2d_rel_sigma: 0.04
