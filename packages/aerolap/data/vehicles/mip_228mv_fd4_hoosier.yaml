# MIP 228MV FD4 latest (mip_228mv_fd4.yaml, OptimumLap mu 1.3) with the Magic Formula Hoosier tyre.
# Friction LEVEL = OptimumLap's mu 1.3 at tires.ref_load_N (mf_mu_scaling: true); load sensitivity, slip
# stiffness and curve shape from data/tires/hoosier_fs_asphalt_estimate.tir (published outdoor asphalt data).
name: MIP 228MV FD4 (mu 1.3) + Hoosier MF tyre
environment:
  air_density_kg_m3: 1.225
mass:
  total_kg: 310.0
  weight_dist_front: 0.5
  cg_height_mm: 270
  unsprung_front_kg: 15
  unsprung_rear_kg: 16
  pitch_inertia_kgm2: null
  roll_inertia_kgm2: null
geometry:
  wheelbase_mm: 1550
  track_front_mm: 1220
  track_rear_mm: 1190
tires:
  radius_mm: 232.0
  mu_x: 1.3
  mu_y: 1.3
  ref_load_N: 650
  load_sensitivity: 0.0
  min_mu_factor: 0.5
  vertical_rate_N_per_mm: 100
  peak_slip_deg: 6.5
  camber_optimum_deg: -1.2
  camber_sensitivity_per_deg2: 0.006
  rolling_resistance: 0.015
  mf_file: ../tires/hoosier_fs_asphalt_estimate.tir
  mf_mu_scaling: true
  combined_exponent: null
suspension:
  front:
    spring_rate_N_per_mm: 40
    motion_ratio: 1.0
    arb_rate_Nm_per_deg: 250
    heave_spring_N_per_mm: 40
    roll_center_mm: 30
    static_ride_height_mm: 35
    static_camber_deg: -1.8
    camber_gain_deg_per_mm: -0.025
    anti_dive: 0.15
    damping_ratio: 0.65
  rear:
    spring_rate_N_per_mm: 45
    motion_ratio: 1.0
    arb_rate_Nm_per_deg: 150
    heave_spring_N_per_mm: 30
    roll_center_mm: 50
    static_ride_height_mm: 45
    static_camber_deg: -1.2
    camber_gain_deg_per_mm: -0.02
    anti_lift: 0.1
    anti_squat: 0.2
    damping_ratio: 0.65
brakes:
  bias_front: null
aero:
  type: constant
  cl: 1.57
  cd: 0.74
  frontal_area_m2: 0.635
  cop_front: 0.5
  drag_height_mm: 520
  floor_width_mm: 900
  bottoming_clearance_mm: 5
powertrain:
  type: ev
  drive: rwd
  differential: lsd
  efficiency: 0.6
  ev:
    drivetrain_efficiency: 0.97
    inverter_efficiency: 0.97
    power_limit_kW: 80
    n_motors: 1
    motor: emrax_228
    motor_variant: MV
    motor_cooling: LC
    dc_voltage_V: 550.0
    reduction_ratio: 4.0
battery:
  series: 132
  parallel: 4
  soc: 1.0
  soc_min: 0.05
  soc_stages: 3
  interconnect_resistance_mOhm: 30
  max_current_A: null
  cell:
    capacity_Ah: 4.0
    resistance_mOhm: 13
    max_current_A: 45
    v_min: 2.8
    ocv:
    - - 0.0
      - 3.0
    - - 0.1
      - 3.35
    - - 0.2
      - 3.5
    - - 0.5
      - 3.68
    - - 0.8
      - 3.95
    - - 1.0
      - 4.18
  regen_power_kW: 0
  regen_axle_share: 0.35
