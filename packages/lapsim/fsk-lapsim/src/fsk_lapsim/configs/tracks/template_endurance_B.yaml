# 손으로 설계한 엔듀런스 템플릿 B (반시계 닫힌 루프 ~0.8 km).
# 총 회전 +360°, 직선 14·16 번 길이를 풀어서 정확히 폐합 (closure: adjust_straights).
name: template_endurance_B
type: segments
closure: adjust_straights
adjust: [14, 16]
max_straight_m: 80
segments:
  - {type: straight, length_m: 35}                                        # 0 출발 직선 (E)
  - {type: slalom, n_cones: 6, spacing_m: 10, weave_m: 2.0, direction: left}  # 1
  - {type: straight, length_m: 20}                                        # 2
  - {type: arc, radius_m: 15, angle_deg: 90, direction: left}             # 3 → N
  - {type: straight, length_m: 45}                                        # 4
  - {type: arc, radius_m: 10, angle_deg: 35, direction: left}             # 5 시케인
  - {type: straight, length_m: 4}                                         # 6
  - {type: arc, radius_m: 10, angle_deg: 35, direction: right}            # 7
  - {type: straight, length_m: 35}                                        # 8
  - {type: arc, radius_m: 20, angle_deg: 90, direction: left}             # 9 → W
  - {type: straight, length_m: 70}                                        # 10
  - {type: arc, radius_m: 5, angle_deg: 180, direction: left}             # 11 헤어핀 → E
  - {type: straight, length_m: 20}                                        # 12
  - {type: arc, radius_m: 8, angle_deg: 180, direction: right}            # 13 → W
  - {type: straight, length_m: 60}                                        # 14 (폐합 조정)
  - {type: arc, radius_m: 12, angle_deg: 90, direction: left}             # 15 → S
  - {type: straight, length_m: 40}                                        # 16 (폐합 조정)
  - {type: arc, radius_m: 25, angle_deg: 90, direction: left}             # 17 → E
